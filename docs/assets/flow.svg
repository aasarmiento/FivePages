<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d">
  <title id="t">FivePages user flow</title>
  <desc id="d">A dot travels through the main flow: onboarding, library, add a book, book details, reading timer, log pages, progress and streak.</desc>
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .box { fill: #FFFFFF; stroke: #E2E2DD; stroke-width: 2; }
    .lbl { font-size: 17px; font-weight: 700; fill: #1F2937; text-anchor: middle; }
    .sub { font-size: 12.5px; fill: #6B7280; text-anchor: middle; }
    .num { font-size: 13px; font-weight: 700; fill: #2E6F40; }
    .node { animation: glow 16s infinite; }
    .node rect.box { animation: ring 16s infinite; }
    @keyframes ring { 0%, 100% { stroke: #E2E2DD; fill: #FFFFFF; } 4%, 9% { stroke: #2E6F40; fill: #E6F0E8; } 14% { stroke: #E2E2DD; fill: #FFFFFF; } }
    .n1 rect.box { animation-delay: 0s; } .n2 rect.box { animation-delay: 2s; } .n3 rect.box { animation-delay: 4s; } .n4 rect.box { animation-delay: 6s; }
    .n5 rect.box { animation-delay: 8s; } .n6 rect.box { animation-delay: 10s; } .n7 rect.box { animation-delay: 12s; } .n8 rect.box { animation-delay: 14s; }
  </style>
  <rect x="2" y="2" width="996" height="466" rx="22" fill="#FAFAF8" stroke="#E2E2DD" stroke-width="2"/>
  <text class="sans" x="30" y="40" font-size="20" font-weight="700" fill="#1F2937">Main user flow</text>
  <text class="sans" x="30" y="62" font-size="13" fill="#6B7280">Follow the dot: first launch to a logged reading session and a streak.</text>

  <path id="route" d="M145 150 H385 H625 H865 V350 H625 H385 H145" fill="none" stroke="#C9CEC9" stroke-width="3" stroke-dasharray="7 7"/>

  <g class="n1 node"><rect class="box" x="60" y="115" width="170" height="70" rx="14"/><text class="sans num" x="74" y="136">01</text><text class="sans lbl" x="145" y="152">Welcome</text><text class="sans sub" x="145" y="171">first screen</text></g>
  <g class="n2 node"><rect class="box" x="300" y="115" width="170" height="70" rx="14"/><text class="sans num" x="314" y="136">02</text><text class="sans lbl" x="385" y="152">How it works</text><text class="sans sub" x="385" y="171">3 simple steps</text></g>
  <g class="n3 node"><rect class="box" x="540" y="115" width="170" height="70" rx="14"/><text class="sans num" x="554" y="136">03</text><text class="sans lbl" x="625" y="152">Reminders</text><text class="sans sub" x="625" y="171">gentle nudges</text></g>
  <g class="n4 node"><rect class="box" x="780" y="115" width="170" height="70" rx="14"/><text class="sans num" x="794" y="136">04</text><text class="sans lbl" x="865" y="152">My books</text><text class="sans sub" x="865" y="171">search · sort</text></g>
  <g class="n5 node"><rect class="box" x="780" y="315" width="170" height="70" rx="14"/><text class="sans num" x="794" y="336">05</text><text class="sans lbl" x="865" y="352">Add a book</text><text class="sans sub" x="865" y="371">daily goal in 1 look</text></g>
  <g class="n6 node"><rect class="box" x="540" y="315" width="170" height="70" rx="14"/><text class="sans num" x="554" y="336">06</text><text class="sans lbl" x="625" y="352">Book details</text><text class="sans sub" x="625" y="371">options · history</text></g>
  <g class="n7 node"><rect class="box" x="300" y="315" width="170" height="70" rx="14"/><text class="sans num" x="314" y="336">07</text><text class="sans lbl" x="385" y="352">Timer + Log</text><text class="sans sub" x="385" y="371">Nice one! · undo</text></g>
  <g class="n8 node"><rect class="box" x="60" y="315" width="170" height="70" rx="14"/><text class="sans num" x="74" y="336">08</text><text class="sans lbl" x="145" y="352">Progress</text><text class="sans sub" x="145" y="371">streak · grace day</text></g>

  <circle r="9" fill="#2E6F40">
    <animateMotion dur="16s" repeatCount="indefinite" rotate="0"><mpath href="#route"/></animateMotion>
  </circle>
  <circle r="16" fill="#2E6F40" opacity=".18">
    <animateMotion dur="16s" repeatCount="indefinite" rotate="0"><mpath href="#route"/></animateMotion>
  </circle>

  <text class="sans" x="30" y="440" font-size="12.5" fill="#6B7280">Also built: Settings and Reminder windows, Edit title, Edit goal, Delete book, Session History, Missed yesterday, Streak Freeze and Fresh Start.</text>
</svg>
